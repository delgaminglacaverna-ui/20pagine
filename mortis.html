<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Memento mori</title><link rel="stylesheet" href="/assets/mortis.css">
</head>
<body>
<main>
<header><span class="signal"><span aria-hidden="true">●</span> SIGNAL</span><span id="route-name">MEMENTO MORI</span></header>
<section class="monitor" aria-label="Animazione artistica di un monitor cardiaco verde">
<div class="reading"><div><span class="caption">HEART RATE</span><strong>72 <small>BPM</small></strong></div><span class="heart" aria-hidden="true">♥</span></div>
<canvas id="ecg" aria-label="Tracciato ECG decorativo, non una misurazione medica"></canvas>
<div class="monitor-footer"><span>ECG · II</span><span>25 mm/s · SIMULAZIONE</span><span>♡</span></div>
</section>
<h1 id="page-title">Memento mori.</h1><p class="subtitle">Finché batte.</p>
<div class="controls"><button id="sound" type="button" aria-pressed="false">Attiva battito</button><label>Volume <input id="volume" type="range" min="0" max="100" value="35"></label></div>
<p id="audio-status" role="status">Tocca «Attiva battito» per ascoltare il cuore.</p>
<footer><p>Esperienza audiovisiva. Il tracciato e il valore sono simulati, non dati medici.</p><nav aria-label="Altre pagine"><a href="/morte">morte</a><a href="/mortis">mortis</a><a href="/memento-mori">memento mori</a><a href="/">← torna</a></nav></footer>
</main><script src="/assets/mortis.js"></script>
</body></html>
