    <link rel="stylesheet" href="/assets/legacy-layout.css" />
    <style>
      :root { color-scheme: light; color-scheme: only light; }
      [data-game-layout] > * { min-width: 0; }
      [data-chess-board] { color-scheme: light; color-scheme: only light; forced-color-adjust: none; }
      @font-face {
        font-family: "Chess Symbols";
        src: url("assets/fonts/NotoSansSymbols2-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
        unicode-range: U+2654-265F;
      }
      .chess-piece { font-variant-emoji: text; font-synthesis: none;
        color-scheme: only light; forced-color-adjust: none; filter: none !important; }
      .chess-piece[data-piece-side="white"] { color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
      .chess-piece[data-piece-side="black"] { color: #111111 !important; -webkit-text-fill-color: #111111 !important; }
      .skip-clock { position: relative; display: inline-block; flex-shrink: 0;
        width: 54px; height: 54px; border-radius: 50%; background: #000;
        overflow: hidden; border: 0; padding: 0; appearance: none; }
      .skip-clock:disabled { opacity: 1; cursor: default; }
      .skip-clock-ready { background: #000; cursor: pointer; }
      .skip-clock-ready:hover { border-color: #fff; }
      .skip-clock-cross { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; animation: skip-cross .6s step-end infinite; z-index: 2; }
      .skip-clock-cross-2 { animation-delay: -.4s; } .skip-clock-cross-3 { animation-delay: -.2s; }
      @keyframes skip-cross { 0% { opacity: 1; } 33.333% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .skip-clock-cross { animation: none; opacity: 0; } .skip-clock-cross-1 { opacity: 1; } }
      .skip-clock:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
      .skip-clock-ready .skip-clock-face { animation: none; opacity: 0; }
      .skip-clock-ready .skip-clock-face-1 { opacity: 1; }
      .skip-clock-face { position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; opacity: 0; animation: clock-sketch .6s step-end infinite; }
      .skip-clock-face-2 { animation-delay: -.4s; }
      .skip-clock-face-3 { animation-delay: -.2s; }
      .skip-clock-hand { position: absolute; left: calc(50% - 1.5px); bottom: 50%;
        width: 3px; height: 33%; border-radius: 50% 50% 2px 2px;
        background: #fff; transform-origin: 50% 100%; }
      @keyframes clock-sketch { 0% { opacity: 1; } 33.333% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .skip-clock-face { animation: none; opacity: 0; }
        .skip-clock-face-1 { opacity: 1; }
      }
      .french-piece { position: relative; display: inline-block; isolation: isolate; }
      .french-piece > span { position: absolute; pointer-events: none; font-family: sans-serif;
        font-weight: 700; -webkit-text-stroke: 0; text-shadow: none; line-height: 1;
        -webkit-text-fill-color: currentColor; }
      /* Draw the cigarette without an emoji, which can include its own smoke. */
      .french-cigarette { width: .32em; height: .065em; right: -.08em; top: 27%;
        border: 1px solid #64748b; border-radius: .015em;
        background: linear-gradient(to right, #d69a51 0 28%, #fff 28% 90%, #ef5b28 90%);
        transform: rotate(-12deg); transform-origin: left center; }
